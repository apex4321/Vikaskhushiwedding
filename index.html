<style>

/* =====================================================
   FINAL GANESH + CINEMATIC REVEAL FIX
===================================================== */

/* GANESH IMAGE - FULL IMAGE, FACE WILL NOT BE CUT */
.ganeshFrame{
  width:min(430px,88vw) !important;
  aspect-ratio:4 / 5 !important;

  padding:14px !important;

  border-radius:48% 48% 45% 45% / 38% 38% 55% 55% !important;

  overflow:hidden !important;

  background:
    radial-gradient(circle at 50% 35%,
      rgba(255,241,187,.95),
      rgba(181,98,27,.7) 55%,
      rgba(85,15,12,.9)
    ) !important;

  box-shadow:
    0 0 0 8px rgba(255,218,120,.16),
    0 0 40px rgba(255,183,57,.5),
    0 25px 70px rgba(0,0,0,.6) !important;
}

/* IMPORTANT - FULL GANESH IMAGE */
.ganeshFrame img{
  width:100% !important;
  height:100% !important;

  object-fit:contain !important;
  object-position:center center !important;

  border-radius:42% 42% 48% 48% / 35% 35% 55% 55% !important;

  background:
    radial-gradient(circle,
      #f7ddb0,
      #c46b2e
    ) !important;
}


/* =====================================================
   BETTER RED ROYAL BACKGROUND
===================================================== */

.royal-section{
  background:
    radial-gradient(circle at 50% 25%,
      rgba(214,101,35,.35),
      transparent 25%),

    radial-gradient(circle at 15% 50%,
      rgba(255,180,70,.15),
      transparent 22%),

    radial-gradient(circle at 85% 60%,
      rgba(255,120,40,.12),
      transparent 24%),

    linear-gradient(
      135deg,
      #270103,
      #5d080c 35%,
      #920f14 50%,
      #500609 72%,
      #210103
    ) !important;
}


/* EXTRA ROYAL DECORATIONS */
.royal-section:after{
  content:"✦  ❀  ✦  ❀  ✦";

  position:absolute;

  top:185px;
  left:50%;

  transform:translateX(-50%);

  width:100%;

  text-align:center;

  font-size:clamp(20px,5vw,38px);

  letter-spacing:clamp(10px,5vw,35px);

  color:rgba(255,208,105,.45);

  text-shadow:
    0 0 15px rgba(255,176,50,.7);

  pointer-events:none;

  z-index:2;
}


/* =====================================================
   NAME CINEMATIC REVEAL
===================================================== */

/* STOP OLD AUTOMATIC ANIMATION */
.revealSmall,
.revealNames{
  opacity:0 !important;
}


/* SMALL TEXT FIRST */
body.cinematicStart .revealSmall{
  animation:
    smallReveal 1.5s ease forwards !important;

  animation-delay:2.4s !important;
}


/* VIKAS WEDS KHUSHI */
body.cinematicStart .revealNames{
  animation:
    cinematicNames 2.8s cubic-bezier(.16,1,.3,1) forwards !important;

  animation-delay:3.1s !important;
}


@keyframes smallReveal{

  0%{
    opacity:0;
    letter-spacing:16px;
    transform:translateY(20px);
  }

  100%{
    opacity:1;
    letter-spacing:7px;
    transform:translateY(0);
  }

}


@keyframes cinematicNames{

  0%{
    opacity:0;
    transform:
      scale(.75)
      translateY(70px);

    filter:
      blur(18px);

    text-shadow:
      0 0 0 transparent;
  }

  55%{
    opacity:1;

    filter:
      blur(0);

    text-shadow:
      0 0 45px rgba(255,181,56,.95);
  }

  100%{
    opacity:1;

    transform:
      scale(1)
      translateY(0);

    filter:
      blur(0);

    text-shadow:
      0 0 25px rgba(255,181,56,.55);
  }

}


/* =====================================================
   CINEMATIC DATE REVEAL
===================================================== */

.dateReveal{
  overflow:hidden !important;
}


/* OLD DATE HIDDEN UNTIL REVEAL */
.dateReveal .saveDate,
.dateReveal .dateText,
.dateReveal .dateNote{
  opacity:0;
}


body.cinematicStart .dateReveal .saveDate{
  animation:
    fadeUp 1s ease forwards;

  animation-delay:5.8s;
}


body.cinematicStart .dateReveal .dateText{
  animation:
    dateCinematicReveal 2.5s cubic-bezier(.16,1,.3,1) forwards;

  animation-delay:6.4s;
}


body.cinematicStart .dateReveal .dateNote{
  animation:
    fadeUp 1.2s ease forwards;

  animation-delay:8.2s;
}


@keyframes fadeUp{

  from{
    opacity:0;
    transform:translateY(30px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


@keyframes dateCinematicReveal{

  0%{
    opacity:0;

    transform:
      translateY(80px)
      scale(.7);

    filter:
      blur(20px);

    letter-spacing:25px;
  }

  60%{
    opacity:1;

    transform:
      translateY(-5px)
      scale(1.04);

    filter:
      blur(0);

    letter-spacing:5px;

    text-shadow:
      0 0 45px rgba(255,194,70,1);
  }

  100%{
    opacity:1;

    transform:
      translateY(0)
      scale(1);

    filter:
      blur(0);

    letter-spacing:2px;

    text-shadow:
      0 0 25px rgba(255,194,70,.6);
  }

}


/* =====================================================
   COUNTDOWN - HIDDEN UNTIL CINEMATIC INTRO FINISHES
===================================================== */

.countdownTitle,
.countdown{
  opacity:0;
  transform:translateY(40px);
}


body.cinematicStart .countdownTitle{
  animation:
    countdownReveal 1.2s ease forwards;

  animation-delay:9.5s;
}


body.cinematicStart .countdown{
  animation:
    countdownReveal 1.5s ease forwards;

  animation-delay:10.2s;
}


@keyframes countdownReveal{

  to{
    opacity:1;
    transform:translateY(0);
  }

}


.countBox{
  position:relative;

  overflow:hidden;
}


.countBox:before{
  content:"";

  position:absolute;

  top:0;
  left:-120%;

  width:70%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.25),
      transparent
    );

  transform:skewX(-25deg);

  animation:
    shineBox 4s infinite;
}


@keyframes shineBox{

  0%{
    left:-120%;
  }

  100%{
    left:160%;
  }

}


/* =====================================================
   GATE MORE BEAUTIFUL
===================================================== */

.gate{
  background:

    radial-gradient(
      circle at 50% 35%,
      rgba(255,193,75,.22),
      transparent 28%
    ),

    linear-gradient(
      90deg,
      #3b0305,
      #7d0c10 22%,
      #b04418 48%,
      #7d0c10 75%,
      #3b0305
    ) !important;
}


.gate:before{
  inset:28px !important;

  border:3px solid #f5d27b !important;

  box-shadow:
    inset 0 0 35px rgba(255,190,70,.25),
    0 0 20px rgba(255,200,90,.12) !important;
}


.gate:after{
  content:"✦   ❀   ✦" !important;

  top:40% !important;
  bottom:auto !important;

  font-size:clamp(30px,7vw,52px) !important;
}


/* NO NAMES ON GATE - ONLY CELEBRATION TEXT */
.gateHint{
  top:24% !important;

  font-size:clamp(14px,4vw,25px) !important;
}


/* =====================================================
   MOBILE FIX
===================================================== */

@media(max-width:600px){

  .ganeshContent{
    padding-top:145px !important;
  }

  .ganeshFrame{
    width:min(400px,90vw) !important;
  }

  .mantra{
    font-size:clamp(20px,5.5vw,30px) !important;
    margin-top:32px !important;
  }

  .revealNames{
    font-size:clamp(42px,13vw,65px) !important;
  }

  .countdown{
    gap:7px !important;
  }

  .countBox{
    padding:17px 4px !important;
  }

  .countLabel{
    font-size:9px !important;
    letter-spacing:1px !important;
  }

}

</style>


<script>

/* =====================================================
   FINAL GATE OPENING
===================================================== */

function openGate(){

  const leftGate =
    document.querySelector(".leftGate");

  const rightGate =
    document.querySelector(".rightGate");

  const gateScreen =
    document.getElementById("gateScreen");

  /* OPEN BOTH GATES */

  if(leftGate){
    leftGate.classList.add("open");
  }

  if(rightGate){
    rightGate.classList.add("open");
  }


  /* START CINEMATIC WEBSITE REVEAL */

  document.body.classList.add(
    "cinematicStart"
  );


  /* TRY MUSIC AFTER USER CLICK */

  const music =
    document.getElementById("bgMusic");

  if(music){

    music.volume = 0.45;

    music.play().catch(function(){
      console.log("Music waiting for browser permission");
    });

  }


  /* REMOVE GATE AFTER ANIMATION */

  setTimeout(function(){

    if(gateScreen){
      gateScreen.style.display =
        "none";
    }

  },2300);

}


/* =====================================================
   MAKE RANDOM COUNTDOWN
   RANDOM VALUE FIRST, THEN IT COUNTS DOWN
===================================================== */

let totalSeconds =

  (Math.floor(Math.random() * 80) + 20)
  * 86400

  +

  (Math.floor(Math.random() * 23) + 1)
  * 3600

  +

  (Math.floor(Math.random() * 59) + 1)
  * 60

  +

  (Math.floor(Math.random() * 59) + 1);


/* FORMAT TWO DIGITS */

function twoDigits(number){

  return String(number)
    .padStart(2,"0");

}


/* UPDATE COUNTDOWN */

function updateCountdown(){

  let days =
    Math.floor(
      totalSeconds / 86400
    );

  let remaining =
    totalSeconds % 86400;


  let hours =
    Math.floor(
      remaining / 3600
    );

  remaining =
    remaining % 3600;


  let minutes =
    Math.floor(
      remaining / 60
    );


  let seconds =
    remaining % 60;


  const daysEl =
    document.getElementById("days");

  const hoursEl =
    document.getElementById("hours");

  const minutesEl =
    document.getElementById("minutes");

  const secondsEl =
    document.getElementById("seconds");


  if(daysEl){
    daysEl.textContent =
      twoDigits(days);
  }

  if(hoursEl){
    hoursEl.textContent =
      twoDigits(hours);
  }

  if(minutesEl){
    minutesEl.textContent =
      twoDigits(minutes);
  }

  if(secondsEl){
    secondsEl.textContent =
      twoDigits(seconds);
  }


  if(totalSeconds > 0){

    totalSeconds--;

  }else{

    /* NEW RANDOM COUNTDOWN
       WHEN OLD ONE FINISHES */

    totalSeconds =

      (Math.floor(Math.random() * 80) + 20)
      * 86400

      +

      (Math.floor(Math.random() * 23) + 1)
      * 3600

      +

      (Math.floor(Math.random() * 59) + 1)
      * 60

      +

      (Math.floor(Math.random() * 59) + 1);

  }

}


/* START COUNTDOWN */

updateCountdown();

setInterval(
  updateCountdown,
  1000
);

</script>
